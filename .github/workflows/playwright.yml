name: Playwright Tests

on:
  # every push / PR: only smoke tests (no real bookings)
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # manual run: Actions -> Playwright Tests -> Run workflow
  workflow_dispatch:
    inputs:
      booking_count:
        description: 'How many Calendly slots to book (0 = smoke tests only)'
        required: true
        default: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BOOKING_COUNT: ${{ github.event.inputs.booking_count || '0' }}
      CANCEL_AFTER_TEST: 'true'
      EMAIL_PROVIDER: ${{ secrets.TESTMAIL_API_KEY != '' && 'testmail' || '' }}
      TESTMAIL_API_KEY: ${{ secrets.TESTMAIL_API_KEY }}
      TESTMAIL_NAMESPACE: ${{ secrets.TESTMAIL_NAMESPACE }}
      MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
      MAILSLURP_INBOX_IDS: ${{ secrets.MAILSLURP_INBOX_IDS }}
      QASE_MODE: ${{ secrets.QASE_TESTOPS_API_TOKEN != '' && 'testops' || 'off' }}
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
      QASE_TESTOPS_PROJECT: ${{ secrets.QASE_TESTOPS_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # BOOKING_COUNT=0 -> the booking spec generates no tests, only smoke tests run
      - name: Run tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
